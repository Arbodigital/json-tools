[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "json-tools"
version = "0.1.0"
description = "Ferramenta para ler, escrever e validar JSON, com CLI, API HTTP e servidor MCP"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
schema = ["jsonschema>=4"]
dev = ["pytest>=7"]

[project.scripts]
json-tools = "json_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
